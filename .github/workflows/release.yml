name: Build and Release

on:
  push:
    branches:
      - master
    paths:
      - 'src/plugins/dmArchiver/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Build plugin
        run: |
          cd src/plugins/dmArchiver
          # Vencord compiles .ts files at runtime, so we just need the source
          if (Test-Path "dist") { Remove-Item -Recurse -Force "dist" }
          New-Item -ItemType Directory -Path "dist" | Out-Null
          Copy-Item -Path "index.ts" -Destination "dist/index.js" -Force
        working-directory: src

      - name: Package as ZIP
        run: |
          $version = if ($env:GITHUB_REF -match 'refs/tags/(.*)') { $matches[1] } else { "latest" }
          $archiveName = "dmArchiver-$version.zip"
          Compress-Archive -Path "src/plugins/dmArchiver/index.ts", "src/plugins/dmArchiver/README.md" -DestinationPath $archiveName -Force
          Write-Output "archive=$archiveName" >> $env:GITHUB_OUTPUT
        working-directory: src
        id: package

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: src/${{ steps.package.outputs.archive }}
          generate_release_notes: true

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: src/install.ps1

      - name: Upload Plugin ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: src/${{ steps.package.outputs.archive }}

  release-with-installer:
    needs: release
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release with All Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/plugin/*.zip
            artifacts/installer/install.ps1
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}