name: Build and Release

on:
  push:
    branches:
      - master
    paths:
      - 'src/plugins/dmArchiver/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          if ($env:GITHUB_REF -match 'refs/tags/v(.+)') {
            $version = $matches[1]
          } else {
            $version = "0.0.0-$(Get-Date -Format 'yyyyMMdd-HHmmss')"
          }
          Write-Output "version=$version" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Build installer
        id: build
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $installerContent = @"
          # DMArchiver Installer v$version
          Write-Host "=== DMArchiver Installer v$version ===" -ForegroundColor Cyan
          Write-Host ""

          $username = $env:USERNAME
          $pluginName = 'dmArchiver'

          # Find Discord version from app-settings.json
          $appSettings = "C:\Users\$username\AppData\Roaming\Discord\app-settings.json"
          if (Test-Path $appSettings) {
              try {
                  $settings = Get-Content $appSettings -Raw | ConvertFrom-Json
                  if ($settings.version) {
                      $discordVersion = $settings.version
                  }
              } catch {
                  Write-Host "Could not read Discord version, using default" -ForegroundColor Yellow
                  $discordVersion = "0.0.XXX"
              }
          } else {
              Write-Host "Could not find app-settings.json, using default" -ForegroundColor Yellow
              $discordVersion = "0.0.XXX"
          }

          $pluginDir = "C:\Users\$username\AppData\Roaming\Discord\$discordVersion\modules\vencord\plugins\$pluginName"

          Write-Host "Discord Version: $discordVersion" -ForegroundColor Green
          Write-Host "Plugin Directory: $pluginDir" -ForegroundColor Green
          Write-Host ""

          # Check if Discord is running
          $discordProcess = Get-Process -Name "Discord*" -ErrorAction SilentlyContinue
          if ($discordProcess) {
              Write-Warning "Discord is running. Please close Discord before installing plugins."
              Write-Host "Press any key to exit..."
              $null = $Host.UI.RawUI.ReadKey("NoEcho,IncludeKeyDown")
              exit 1
          }

          # Create plugin directory if it doesn't exist
          if (-not (Test-Path $pluginDir)) {
              Write-Host "Creating plugin directory..." -ForegroundColor Yellow
              try {
                  New-Item -ItemType Directory -Path $pluginDir -Force | Out-Null
              } catch {
                  Write-Host "Error creating plugin directory: $_" -ForegroundColor Red
                  Write-Host "Press any key to exit..."
                  $null = $Host.UI.RawUI.ReadKey("NoEcho,IncludeKeyDown")
                  exit 1
              }
          }

          # Download latest release from GitHub
          $zipUrl = "https://github.com/redbelter/vencord-dm-archiver/releases/latest/download/dmArchiver-installer.zip"
          $zipPath = [System.IO.Path]::GetTempPath() + "dmArchiver.zip"

          Write-Host "Downloading plugin from GitHub..." -ForegroundColor Cyan
          try {
              Invoke-WebRequest -Uri $zipUrl -OutFile $zipPath -UseBasicParsing
          } catch {
              Write-Host "Error downloading plugin: $_" -ForegroundColor Red
              Write-Host "Press any key to exit..."
              $null = $Host.UI.RawUI.ReadKey("NoEcho,IncludeKeyDown")
              exit 1
          }

          # Extract
          Write-Host "Extracting plugin..." -ForegroundColor Cyan
          $extractDir = [System.IO.Path]::GetTempPath() + "dmArchiver-extract"
          if (Test-Path $extractDir) { Remove-Item -Recurse -Force $extractDir }
          New-Item -ItemType Directory -Path $extractDir -Force | Out-Null
          Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force

          # Copy plugin files
          Write-Host "Installing plugin..." -ForegroundColor Cyan
          try {
              Copy-Item -Path (Join-Path $extractDir "index.ts") -Destination (Join-Path $pluginDir "index.ts") -Force
              Copy-Item -Path (Join-Path $extractDir "README.md") -Destination (Join-Path $pluginDir "README.md") -Force
              Write-Host "Plugin installed successfully!" -ForegroundColor Green
          } catch {
              Write-Host "Error installing plugin: $_" -ForegroundColor Red
              Write-Host "Press any key to exit..."
              $null = $Host.UI.RawUI.ReadKey("NoEcho,IncludeKeyDown")
              exit 1
          }

          # Clean up
          Remove-Item -Path $zipPath -Force
          Remove-Item -Path $extractDir -Recurse -Force

          Write-Host ""
          Write-Host "=== Installation Complete ===" -ForegroundColor Green
          Write-Host ""
          Write-Host "Next steps:" -ForegroundColor Cyan
          Write-Host "1. Open Discord (or reload Vencord plugins)"
          Write-Host "2. You can now use these commands:"
          Write-Host "   /list-dm-users"
          Write-Host "   /export-dm-media"
          Write-Host "   /save-dm-text"
          Write-Host "   /toggle-delete-commands"
          Write-Host ""
          Write-Host "Press any key to exit..."
          $null = $Host.UI.RawUI.ReadKey("NoEcho,IncludeKeyDown")
          "@

          Set-Content -Path "dmArchiver-installer.ps1" -Value $installerContent -NoNewline
          Write-Output "installer=dmArchiver-installer.ps1" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Package installer as ZIP
        run: |
          Compress-Archive -Path "dmArchiver-installer.ps1" -DestinationPath "dmArchiver-installer.zip" -Force
        working-directory: src/plugins/dmArchiver

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: src/plugins/dmArchiver/dmArchiver-installer.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}